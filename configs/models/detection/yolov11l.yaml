model:
  name: yolov11l
  task: detect
  pretrained: true
  pretrained_weights: yolov11l.pt
training:
  epochs: 100
  batch_size: 16
  image_size: 640
  optimizer: AdamW
  lr: 0.001
  lr_scheduler: cosine
  warmup_epochs: 5
  weight_decay: 0.0005
  patience: 20
  augmentations:
    brightness: 0.3
    contrast: 0.3
    blur: 0.1
    rotation: 5
    flip_lr: 0.5
  classes:
  - road
  - vehicle
