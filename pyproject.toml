[project]
name = "aai-computer-vision-project"
version = "0.1.0"
description = "Real-time traffic density estimation using computer vision"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ultralytics>=8.2.0",
    "opencv-python>=4.9.0",
    "pillow>=10.0.0",
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "pyarrow>=14.0.0",
    "roboflow>=1.1.0",
    "tensorboard>=2.15.0",
    "wandb>=0.16.0",
    "pyyaml>=6.0.1",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "tqdm>=4.66.0",
    "rich>=13.7.0",
    "loguru>=0.7.0",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "inference-sdk>=1.2.1",
]

[project.optional-dependencies]
dev = ["ruff", "mypy", "pre-commit"]

[tool.ruff]
indent-width = 2

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["B011", "E402"]
